# EKS Auto Mode custom NodePool for Coder workspaces on EC2 Spot.
#
# This adds a *second* workspace compute lane alongside AWS Fargate. It plugs into
# EKS Auto Mode (Karpenter-managed) so nodes auto-scale up on demand and scale to
# zero when idle -- no self-managed node group to operate.
#
# Scheduling contract (see the workspace templates):
#   * Nodes are labelled  coder.workspace/lane=spot
#   * Nodes are tainted    coder.workspace/lane=spot:NoSchedule
# Only workspace pods that opt in (nodeSelector + matching toleration, set when the
# template's "Compute Lane" parameter = spot) land here. Fargate-lane pods carry the
# label compute=fargate and are matched by the Fargate profile instead.
#
# The NodePool references the Auto Mode built-in "default" NodeClass, so the node IAM
# role, subnets, and security groups are inherited from Auto Mode (nothing cluster-
# specific to fill in here).
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: coder-ws-spot
  labels:
    app.kubernetes.io/part-of: coder
spec:
  template:
    metadata:
      labels:
        coder.workspace/lane: spot
    spec:
      # Inherit Auto Mode's managed NodeClass (role / subnets / security groups).
      nodeClassRef:
        group: eks.amazonaws.com
        kind: NodeClass
        name: default
      # Keep everything else off these nodes unless it explicitly tolerates the taint.
      taints:
        - key: coder.workspace/lane
          value: spot
          effect: NoSchedule
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot"]
        - key: eks.amazonaws.com/instance-category
          operator: In
          values: ["c", "m", "r"]
        - key: eks.amazonaws.com/instance-cpu
          operator: In
          values: ["2", "4", "8", "16"]
        - key: eks.amazonaws.com/instance-generation
          operator: Gt
          values: ["5"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
      # Recycle Spot nodes periodically; give workspaces time to drain on reclaim.
      expireAfter: 336h
      terminationGracePeriod: 24h
  # Safety ceiling for the whole Spot lane.
  limits:
    cpu: "1000"
    memory: 1000Gi
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
