  #  value: 
  #- name: CODER_EXTERNAL_AUTH_1_SCOPES
  #  value: applied-permissions/user
  
  # Internal Provisioner
  - name: CODER_PROVISIONER_DAEMONS
    value: "3"
  - name: CODER_LOG_FILTER
    value: "false"
  - name: CODER_DERP_SERVER_ENABLE
    value: "true"
  # coderd sits behind CloudFront/ALB which strips the raw `Upgrade: derp`
  # header (DERP returns HTTP 426), breaking the classic DERP data-plane for
  # clients reaching coderd through the proxy (e.g. Lambda MicroVM workspaces via
  # public egress). Force the DERP map to advertise WebSocket mode so agents and
  # clients relay over WebSockets and coder ssh/apps work. Validated with the
  # awshp-microvm-agent template.
  - name: CODER_DERP_FORCE_WEBSOCKETS
    value: "true"

  # Telemetery and prometheus metric config
  #- name: CODER_TELEMETRY_ENABLE
  #  value: "true"
  #- name: CODER_PROMETHEUS_ADDRESS
  #  value: 0.0.0.0:2112
  #- name: CODER_PROMETHEUS_ENABLE
  #  value: "true"
  #- name: CODER_PROMETHEUS_COLLECT_AGENT_STATS
  #  value: "true"

  # Enable metric scraping
  #podAnnotations:
  #  prometheus.io/port: "2112"
  #  prometheus.io/scrape: "true"

  # ---------------------------------------------------------------------
  # Coder AI Gateway + Coder Agents + Tracing
  # ---------------------------------------------------------------------
  # The Coder AI Gateway (CODER_AI_GATEWAY_ENABLED) is on by default in
  # v2.36.0+; the deprecated CODER_AIBRIDGE_* aliases still work but should
  # not be used. Coder Agents (the in-control-plane agent loop) is available
  # once the AI Gateway is enabled and at least one provider is configured.
  - name: CODER_TRACE_ENABLE
    value: "true"
  # Hide the "Tasks" tab in the dashboard
  - name: CODER_HIDE_AI_TASKS
    value: "true"
  # BYOK: allow users to bring their own model keys through the AI Gateway.
  - name: CODER_AI_GATEWAY_ALLOW_BYOK
    value: "true"

  # ---------------------------------------------------------------------
  # Parity with the partner demo control plane (partner.coderdemo.io)
  # ---------------------------------------------------------------------
  # oauth2: OAuth2 provider endpoints. mcp-server-http: streamable HTTP MCP server.
  - name: CODER_EXPERIMENTS
    value: "oauth2,mcp-server-http"
  # Allow embedding *.<wildcard> app subdomains (patched to the CloudFront domain at
  # deploy time by the same sed that rewrites CODER_WILDCARD_ACCESS_URL below).
  - name: CODER_ADDITIONAL_CSP_POLICY
    value: "frame-src https://*.coder.example.com"

  # ---------------------------------------------------------------------
  # Premium / Enterprise features
  # ---------------------------------------------------------------------
  # A Coder Premium license is supplied at deploy time via the CloudFormation
  # `CoderLicenseKey` parameter and applied with `coder licenses add`. The settings
  # below are gated by that license and take effect once it is present:
  #   * High availability -- running more than one coderd replica (replicaCount: 2)
  #     REQUIRES a Premium/Enterprise license.
  #   * Also unlocked by the license: multiple organizations, template RBAC/ACLs,
  #     group & role sync, external provisioners, and appearance/branding.
  # Optional premium toggles (uncomment as needed for a demo):
  #- name: CODER_BROWSER_ONLY
  #  value: "true"
  #- name: CODER_DISABLE_PATH_APPS
  #  value: "false"

  # Enable HA for Coderd (requires a Premium/Enterprise license, supplied via
  # the CoderLicenseKey deployment parameter).
  replicaCount: 2

  resources:
    limits:
      cpu: 2000m
      memory: 4096Mi
    requests:
      cpu: 2000m
      memory: 4096Mi
 
  # Additional pod labels
  #podLabels:
  #  app: coder

  # Pod Topology Spread Constraints
  #topologySpreadConstraints:
  #- maxSkew: 1
  #  topologyKey: kubernetes.io/hostname
  #  whenUnsatisfiable: ScheduleAnyway
  #  labelSelector:
  #    matchLabels:
  #      app: coder
 
  # Service object to expose for Coder
  service:
    enable: true
    type: LoadBalancer
    sessionAffinity: None
    externalTrafficPolicy: Local
    annotations:   
      service.beta.kubernetes.io/aws-load-balancer-type: nlb
      service.beta.kubernetes.io/aws-load-balancer-additional-resource-tags: "Environment=demo,Name=coder-cntrlpln-nlb"
      service.beta.kubernetes.io/aws-load-balancer-target-group-attributes: "deregistration_delay.timeout_seconds=60"
      service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip   
      service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
  
  # Service account configuration - cannot be diabled
  serviceAccount:
    # Whether or not to grant the coder service account permissions to manage workspaces. 
    # This includes permission to manage pods and persistent volume claims in the deployment namespace.
    # It is recommended to keep this on if you are using Kubernetes templates within Coder.
    workspacePerms: true
  
    # Provides the service account permission to manage Kubernetes deployments. 
    # Depends on workspacePerms.
    enableDeployments: true
    
  # TLS secret name
  #tls:
